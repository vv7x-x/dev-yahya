name: flutter_chat_app
description: A Flutter chat application with owner notifications and group features
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_messaging: ^14.7.10
  firebase_storage: ^11.5.6
  provider: ^6.1.1
  flutter_local_notifications: ^16.3.2
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  uuid: ^4.2.1
  permission_handler: ^11.1.0
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/